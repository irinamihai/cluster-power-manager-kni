# These resources constitute the fully configured set of manifests
# used to generate the 'manifests/' directory in a bundle.
 resources:
 - bases/cluster-power-manager.clusterserviceversion.yaml
 - ../ocp
 - ../samples
 - ../scorecard
 replacements:
 - source:
     kind: Deployment
     name: controller-manager
     fieldPath: spec.template.spec.containers.[name=manager].env.[name=RELATED_IMAGE_NODE_AGENT].value
   targets:
   - select:
       kind: ClusterServiceVersion
     fieldPaths:
     - spec.relatedImages.[name=node-agent].image
